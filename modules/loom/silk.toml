[package]
name = "loom"
description = "Loom, an Elm-style UI framework over ui-protocol: model, messages, view, update, commands"
version = "0.1.0"
kind = "library"
exports = ["lib", "aria", "equal", "drawing", "font", "heap", "ui", "document", "css", "keys", "diff", "app", "backend", "program", "shell", "show", "journal", "keep", "runtime", "seq", "fibers", "virtual_list", "windows"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "68ceaa0fc794583fb46dd7da01a33394ff127c8b", path = "modules/protocol", package = "ui-protocol" }
