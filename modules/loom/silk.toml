[package]
name = "loom"
description = "Loom, an Elm-style UI framework over ui-protocol: model, messages, view, update, commands"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "aria", "equal", "font", "heap", "ui", "document", "css", "keys", "diff", "app", "backend", "program", "shell", "show", "journal", "runtime", "seq", "tasks", "virtual_list", "windows"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "b6332a68e2c1c46f1cd046de1a7194e5920134a4", path = "modules/protocol", package = "ui-protocol" }
