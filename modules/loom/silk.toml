[package]
name = "loom"
description = "Loom, an Elm-style UI framework over ui-protocol: model, messages, view, update, commands"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "aria", "equal", "font", "heap", "ui", "document", "css", "keys", "diff", "app", "backend", "program", "shell", "show", "journal", "keep", "runtime", "seq", "tasks", "virtual_list", "windows"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "03c89d216d5ea7ce35244dee9a378e60ef947a6c", path = "modules/protocol", package = "ui-protocol" }
