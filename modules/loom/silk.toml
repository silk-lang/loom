[package]
name = "loom"
description = "Loom, an Elm-style UI framework over ui-protocol: model, messages, view, update, commands"
version = "0.1.0"
kind = "library"
exports = ["lib", "aria", "equal", "font", "heap", "ui", "document", "css", "keys", "diff", "app", "backend", "program", "shell", "show", "journal", "keep", "runtime", "seq", "fibers", "virtual_list", "windows"]

[dependencies]
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/protocol", package = "ui-protocol" }
