[package]
name = "loom-window"
description = "Runs a loom application in a native window"
version = "0.1.0"
kind = "library"
exports = ["lib", "background", "images", "commands", "keeper", "program"]

[dependencies]
loom = { path = "..", package = "loom" }
loom_tree = { path = "../tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/tree", package = "ui-tree" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/tree/window", package = "ui-tree-window" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "edd2b69455340c890271897154e81882d0123da0", path = "modules/inspect/server", package = "ui-inspect-server" }
loom_inspect = { path = "../inspect", package = "loom-inspect" }
ui_devtools = { path = "../../devtools", package = "ui-inspect-devtools" }
font_collection = { git = "https://github.com/silk-lang/lib-fonts.git", rev = "ca7a2b41659275ce1b5aafdb846b89ac48061658", path = "modules/collection", package = "font-collection" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/atlas", package = "graphics-atlas" }
vector = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/vector", package = "graphics-vector" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/ui_renderer", package = "graphics-ui-renderer" }
window = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/platform/window", package = "platform-window" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }

codec = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "07f1c411416638fe54956446bf5332608cdb90e7", path = "modules/codec", package = "graphics-codec" }
