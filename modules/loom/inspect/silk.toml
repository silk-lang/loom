[package]
name = "loom-inspect"
description = "The silk-ui inspector extension: a program's messages, its model after each, and the Program panel"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "program", "panel", "extension"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d4b16ac7b70b24e9ff1817feb898b3aca7991a4b", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "d4b16ac7b70b24e9ff1817feb898b3aca7991a4b", path = "modules/protocol", package = "ui-protocol" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "d4b16ac7b70b24e9ff1817feb898b3aca7991a4b", path = "modules/inspect/server", package = "ui-inspect-server" }
