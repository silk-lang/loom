[package]
name = "loom-inspect"
description = "The silk-ui inspector extension: a program's messages, its model after each, and the Program panel"
version = "0.1.0"
kind = "library"
exports = ["lib", "program", "panel", "extension"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/protocol", package = "ui-protocol" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "c10419a65ff3485eb63ea7b8903cf063ae635e17", path = "modules/inspect/server", package = "ui-inspect-server" }
