[package]
name = "loom-inspect"
description = "The silk-ui inspector extension: a program's messages, its model after each, and the Program panel"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
exports = ["lib", "program", "panel", "extension"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "a447f9d774dd92f225285dd337e97f03cb68c90f", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "a447f9d774dd92f225285dd337e97f03cb68c90f", path = "modules/protocol", package = "ui-protocol" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "a447f9d774dd92f225285dd337e97f03cb68c90f", path = "modules/inspect/server", package = "ui-inspect-server" }
