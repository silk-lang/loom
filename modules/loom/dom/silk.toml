[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css", "virtual"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d832ab4ecbb99dc1354646f830351c8ac3503f32", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "d832ab4ecbb99dc1354646f830351c8ac3503f32", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "56c7d654640cf497778bbd8175ca01542a3615d4", path = "modules/style", package = "css-style" }
