[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "e21ba8ee723d6daa3f26a25516ae17515edeefa6", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "e21ba8ee723d6daa3f26a25516ae17515edeefa6", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "5567f7bd5c7ea014e999f53f2c5b3c25b9844806", path = "modules/style", package = "css-style" }
