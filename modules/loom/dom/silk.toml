[package]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "35ea715df7d17d9566554ec0087325ba5852a0b0", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "35ea715df7d17d9566554ec0087325ba5852a0b0", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "5961445b3e7cf9db940c1838ef8531ce94ebb467", path = "modules/style", package = "css-style" }
