[package]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "e411fadf18adfdeeffa5032648e48ef737267560", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "e411fadf18adfdeeffa5032648e48ef737267560", path = "modules/protocol", package = "ui-protocol" }
