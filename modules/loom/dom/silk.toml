[package]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "ef730dfd608cbff6f136c3c87dd397e854435116", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "ef730dfd608cbff6f136c3c87dd397e854435116", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "1d387ca416aad3fc0df3d63b732cdc7e8364ca46", path = "modules/style", package = "css-style" }
