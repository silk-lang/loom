[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css", "virtual"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "d3fcc84cfb5ee4f547bcbb0259afe3f5c7970c0f", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "d3fcc84cfb5ee4f547bcbb0259afe3f5c7970c0f", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "6cb4084cf79e2bbd398a2e2dcbc91b4a6b43a61d", path = "modules/style", package = "css-style" }
