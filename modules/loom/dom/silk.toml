[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css", "virtual"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "b18a97eee25b6d3b8c1df69d1fe6e9777625cd92", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "b18a97eee25b6d3b8c1df69d1fe6e9777625cd92", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "bc4b81d2b3b211db4cc37f40f5f1cc6721c47250", path = "modules/style", package = "css-style" }
