[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css", "virtual"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "8eaabc6bd4340c685c9a0fcdf127845e9a96f453", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "8eaabc6bd4340c685c9a0fcdf127845e9a96f453", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "5d2b1e83b109f386c05b137da85ea01865776174", path = "modules/style", package = "css-style" }
