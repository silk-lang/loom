[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "08146a7840fd42867ba236b8346cdd79002fca97", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "08146a7840fd42867ba236b8346cdd79002fca97", path = "modules/protocol", package = "ui-protocol" }
css_style = { git = "https://github.com/silk-lang/lib-css.git", rev = "39e1e57b06f94570f1b17546588d94a1cc69ded3", path = "modules/style", package = "css-style" }
