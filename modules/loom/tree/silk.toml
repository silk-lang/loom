[package]
name = "loom-tree"
description = "Runs a Loom program on ui-tree: input the browser way, frames, and the test harness"
version = "0.1.0"
kind = "library"
exports = ["lib", "harness"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "c69a7f93d70bd1ed4444d774b1685769fd4c58cc", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "c69a7f93d70bd1ed4444d774b1685769fd4c58cc", path = "modules/protocol", package = "ui-protocol" }
