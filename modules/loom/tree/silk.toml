[package]
name = "loom-tree"
description = "Runs a Loom program on ui-tree: input the browser way, frames, and the test harness"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "harness"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "0858e2a924b399d6a9d5aa50e70f499a291bc3ca", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "0858e2a924b399d6a9d5aa50e70f499a291bc3ca", path = "modules/protocol", package = "ui-protocol" }
