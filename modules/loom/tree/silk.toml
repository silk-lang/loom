[package]
name = "loom-tree"
description = "Runs a Loom program on ui-tree: input the browser way, frames, and the test harness"
version = "0.1.0"
silk-version = "0.1.0-dev.85+45b9e51824ca"
kind = "library"
exports = ["lib", "harness"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "df1165d1c0a95022a996147a04a314a5417d0bf0", path = "modules/tree", package = "ui-tree" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "df1165d1c0a95022a996147a04a314a5417d0bf0", path = "modules/protocol", package = "ui-protocol" }
