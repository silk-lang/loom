[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "1174352b9a93d79bda92bc04e5be89796c76e161", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "b40277a5a58d7ddf679cff350e8ee0f02388ef3f", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
