[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "0ecaa26d0275f3579944c81676a8fa5eefe5ecbe", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "3386d71470b7e45007396591ff231448e98f992f", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
