[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "5d6c9f4d3aefb69327b2305e451db18c140886a8", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "0ac590de9ee1950f384725432829f6afa656f4ed", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "0ac590de9ee1950f384725432829f6afa656f4ed", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
