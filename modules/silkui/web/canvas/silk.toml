[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "38bfab242a7c49f25fac5a5135646571174dcf07", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "dad0eea58af5b801de16085a8666fadef2b746b0", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "dad0eea58af5b801de16085a8666fadef2b746b0", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
