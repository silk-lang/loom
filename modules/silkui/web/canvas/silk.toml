[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { git = "https://github.com/silk-lang/lib-native.git", rev = "56384899c345b81471ecbb4ae9f9dd79cb8358f7", path = "modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { git = "https://github.com/silk-lang/lib-native.git", rev = "56384899c345b81471ecbb4ae9f9dd79cb8358f7", path = "modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
