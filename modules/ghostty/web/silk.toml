[package]
name = "ui-ghostty-web"
description = "The terminal component in a browser page: libghostty-vt in WebAssembly on the DOM host, with a small built-in shell"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "executable"

[dependencies]
ui_ghostty = { path = "..", package = "ui-ghostty" }
ghostty_vt = { path = "../vt", package = "ghostty-vt" }
loom = { path = "../../loom", package = "loom" }
loom_tree = { path = "../../loom/tree", package = "loom-tree" }
loom_dom = { path = "../../loom/dom", package = "loom-dom" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "9fe6fc4ed8a1f0186fdfc60d2c5657aeed34c23e", path = "modules/tree", package = "ui-tree" }
ui_fixtures = { git = "https://github.com/silk-lang/lib-ui.git", rev = "9fe6fc4ed8a1f0186fdfc60d2c5657aeed34c23e", path = "modules/tree/fixtures", package = "ui-tree-fixtures" }
