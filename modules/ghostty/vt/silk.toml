[package]
name = "ghostty-vt"
description = "Terminal emulation through libghostty-vt: owned terminals, input and mouse encoding, selection, styled snapshots and text export"
version = "0.1.0"
silk-version = "0.1.0-dev.88+17d1a1b4d501"
kind = "library"
exports = ["terminal"]

# Run `python3 modules/ghostty/vt/scripts/prepare` once per checkout first: it puts the
# headers and the static library in native/build/ (see the README). build.silk compiles the
# bridge, except on Windows, where prepare compiles it into ghostty-bridge.lib.
