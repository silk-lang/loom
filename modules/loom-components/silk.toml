[package]
name = "loom-components"
description = "Loom Components: components for Loom views: buttons, fields, lists, menus, dialogs and more"
version = "0.1.0"
silk-version = "0.1.0-pipeline.1"
kind = "library"
exports = ["lib", "theme", "layout", "button", "choice", "slider", "field", "list", "tabs", "menu", "dialog", "popover", "numeric", "color", "placement"]

[dependencies]
loom = { path = "../loom", package = "loom" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "74dd232f1ad1bd5f7675cdaa2899afba81760a9f", path = "modules/protocol", package = "ui-protocol" }
