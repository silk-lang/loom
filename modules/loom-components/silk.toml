[package]
name = "loom-components"
description = "Loom Components: components for Loom views: buttons, fields, lists, menus, dialogs and more"
version = "0.1.0"
kind = "library"
exports = ["lib", "theme", "layout", "button", "choice", "slider", "field", "list", "tabs", "menu", "dialog", "popover", "numeric", "color", "placement", "showcase"]

[dependencies]
loom = { path = "../loom", package = "loom" }
ui_protocol = { git = "https://github.com/silk-lang/silkui.git", rev = "8eaabc6bd4340c685c9a0fcdf127845e9a96f453", path = "modules/protocol", package = "ui-protocol" }
