[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
silk-version = "0.1.0-dev.74+205aea3f5b2e"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded"]

[dependencies]
loom = { path = "../loom", package = "loom" }
loom_tree = { path = "../loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "4347d7431ccd555d72cc3da3889fe0a6c251850c", path = "modules/tree", package = "ui-tree" }
ui_inspect = { git = "https://github.com/silk-lang/silkui.git", rev = "4347d7431ccd555d72cc3da3889fe0a6c251850c", path = "modules/inspect", package = "ui-inspect" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "4347d7431ccd555d72cc3da3889fe0a6c251850c", path = "modules/inspect/server", package = "ui-inspect-server" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "4347d7431ccd555d72cc3da3889fe0a6c251850c", path = "modules/tree/window", package = "ui-tree-window" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "62fbbb12b7ee89b2c1f8e79e4c153ee934b2f9b8", path = "modules/properties", package = "css-properties" }
