[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
silk-version = "0.1.0-dev.85+45b9e51824ca"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded"]

[dependencies]
loom = { path = "../loom", package = "loom" }
loom_tree = { path = "../loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "f0b39f3385ccabd7a514b478fcf147295a24dddf", path = "modules/tree", package = "ui-tree" }
ui_inspect = { git = "https://github.com/silk-lang/silkui.git", rev = "f0b39f3385ccabd7a514b478fcf147295a24dddf", path = "modules/inspect", package = "ui-inspect" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "f0b39f3385ccabd7a514b478fcf147295a24dddf", path = "modules/inspect/server", package = "ui-inspect-server" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "f0b39f3385ccabd7a514b478fcf147295a24dddf", path = "modules/tree/window", package = "ui-tree-window" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "607a2fb3625a3007b1d77a033b58a10619fb3073", path = "modules/properties", package = "css-properties" }
