[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded"]

[dependencies]
loom = { path = "../loom", package = "loom" }
loom_tree = { path = "../loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "44d0739494b2600eac553302fe4a4c083df8cfa9", path = "modules/tree", package = "ui-tree" }
ui_inspect = { git = "https://github.com/silk-lang/silkui.git", rev = "44d0739494b2600eac553302fe4a4c083df8cfa9", path = "modules/inspect", package = "ui-inspect" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "44d0739494b2600eac553302fe4a4c083df8cfa9", path = "modules/inspect/server", package = "ui-inspect-server" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "44d0739494b2600eac553302fe4a4c083df8cfa9", path = "modules/tree/window", package = "ui-tree-window" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "39553fcccce7b39ef2a208407d1ade374031f123", path = "modules/properties", package = "css-properties" }
