[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded"]

[dependencies]
loom = { path = "../loom", package = "loom" }
loom_tree = { path = "../loom/tree", package = "loom-tree" }
ui_tree = { git = "https://github.com/silk-lang/silkui.git", rev = "39414ca94c830a7a2c6411b5af1a397350cc708e", path = "modules/tree", package = "ui-tree" }
ui_inspect = { git = "https://github.com/silk-lang/silkui.git", rev = "39414ca94c830a7a2c6411b5af1a397350cc708e", path = "modules/inspect", package = "ui-inspect" }
ui_inspect_server = { git = "https://github.com/silk-lang/silkui.git", rev = "39414ca94c830a7a2c6411b5af1a397350cc708e", path = "modules/inspect/server", package = "ui-inspect-server" }
ui_tree_window = { git = "https://github.com/silk-lang/silkui.git", rev = "39414ca94c830a7a2c6411b5af1a397350cc708e", path = "modules/tree/window", package = "ui-tree-window" }
properties = { git = "https://github.com/silk-lang/lib-css.git", rev = "c8c2afc8cb8591a4fa437b29b5ec2317272bc4e3", path = "modules/properties", package = "css-properties" }
